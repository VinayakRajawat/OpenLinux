name: OLD Live ISO

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso

      - name: Configure Live Build Environment
        run: |
          mkdir -p live-config
          cd live-config
          
          # Initialize live-build configuration for Debian (Bookworm)
          lb config \
            --distribution bookworm \
            --architecture amd64 \
            --binary-images iso-hybrid \
            --apt-recommends false \
            --memtest none

          # Add custom packages to be baked into the image
          echo "linux-image-amd64 python3 curl git htop bat tldr fish starship xorg xinit xfce4 plank" > config/package-lists/studyos.list.chroot

      - name: Build the ISO Image
        run: |
          cd live-config
          sudo lb build

      - name: Locate and Rename ISO
        run: |
          cd live-config
          mv live-image-amd64.hybrid.iso studyos-universal.iso
          ls -lh studyos-universal.iso

      - name: Create GitHub Release and Upload ISO
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: live-config/studyos-universal.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
