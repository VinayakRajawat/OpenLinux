name: Build OpenOS ISO

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso

      - name: Build Custom Debian OpenOS ISO
        run: |
          # 1. Create a minimal Debian Bookworm root file system
          sudo debootstrap --arch=amd64 bookworm rootfs http://deb.debian.org/debian/

          # 2. Install all core packages, study tools, and optional GUI/dock packages inside chroot
          sudo chroot rootfs bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              linux-image-amd64 \
              python3 \
              curl \
              git \
              htop \
              bat \
              tldr \
              fish \
              starship \
              xorg \
              xinit \
              xfce4 \
              plank \
              sudo
            apt-get clean
          '

          # 3. Create live ISO directory structure
          mkdir -p iso_root/live

          # 4. Compress rootfs into squashfs
          sudo mksquashfs rootfs iso_root/live/filesystem.squashfs -comp xz -b 1048576

          # 5. Extract Linux kernel and initrd
          cp rootfs/boot/vmlinuz-* iso_root/live/vmlinuz
          cp rootfs/boot/initrd.img-* iso_root/live/initrd.img

          # 6. Generate the final bootable ISO image
          xorriso -as mkisofs \
            -iso-level 3 \
            -full-iso9660-filenames \
            -volid "OPENOS_LIVE" \
            -output OpenOS-Debian.iso \
            iso_root

          ls -lh OpenOS-Debian.iso

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: OpenOS-Debian.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
