name: Build Debian Micro OS

on:
  workflow_dispatch:

jobs:
  build-os:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y debootstrap cpio gzip

      - name: Build Debian Base System
        run: |
          # Pulls a tiny, bare-minimum Debian 12 (Bookworm) base system
          sudo debootstrap --variant=minbase bookworm ./base_root http://deb.debian.org/debian/

      - name: Install Packages via APT (Customize Here!)
        run: |
          # Mount necessary virtual filesystems so apt works correctly inside chroot
          sudo mount --bind /dev ./base_root/dev
          sudo mount --bind /proc ./base_root/proc
          sudo mount --bind /sys ./base_root/sys
          
          # Chroot in and run apt-get
          # Note: linux-image-amd64 gives us our pre-compiled kernel. 
          # Add ANY massive packages you want to the end of this list!
          sudo chroot ./base_root /bin/bash -c "
            apt-get update && \
            apt-get install -y --no-install-recommends \
              linux-image-amd64 \
              python3 \
              curl \
              htop \
              git
          "
          
          # Clean up apt cache to save space, then unmount
          sudo chroot ./base_root /bin/bash -c "apt-get clean"
          sudo umount ./base_root/sys
          sudo umount ./base_root/proc
          sudo umount ./base_root/dev

      - name: Setup Init Script
        run: |
          sudo bash -c 'cat <<EOF > base_root/init
          #!/bin/bash
          export PATH=/sbin:/usr/sbin:/bin:/usr/bin
          mount -t proc none /proc
          mount -t sysfs none /sys
          mount -t devtmpfs none /dev
          
          echo "=============================================="
          echo " Welcome to your Debian-based Custom OS!      "
          echo "=============================================="
          
          exec /bin/bash
          EOF'
          sudo chmod +x base_root/init

      - name: Extract Kernel & Package Initramfs
        run: |
          # Copy the installed kernel out of the chroot to act as our bootable kernel
          sudo cp base_root/boot/vmlinuz-*amd64 ./bzImage
          
          # Package the file system into initramfs
          cd base_root
          sudo find . -print0 | sudo cpio --null -ov --format=newc | gzip -9 > ../initramfs.cpio.gz
          cd ..

      - name: Upload Finished OS Files
        uses: actions/upload-artifact@v4
        with:
          name: my-debian-linux-os
          path: |
            bzImage
            initramfs.cpio.gz
