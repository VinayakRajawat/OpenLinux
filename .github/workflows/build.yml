name: Build OpenOS ISO

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-openos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools

      - name: Bootstrap Minimal Debian Base
        run: |
          sudo mkdir -p /chroot
          sudo debootstrap --arch=amd64 bookworm /chroot http://deb.debian.org/debian/

      - name: Configure Chroot Environment and Install Packages
        run: |
          sudo mount --bind /dev /chroot/dev
          sudo chroot /chroot bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              linux-image-amd64 \
              python3 \
              curl \
              git \
              htop \
              bat \
              tldr \
              fish \
              starship \
              xorg \
              xinit \
              xfce4 \
              plank \
              sudo
            apt-get clean
          '
          sudo umount /chroot/dev

      - name: Generate Squashfs and ISO Image
        run: |
          mkdir -p iso_root/live
          sudo mksquashfs /chroot iso_root/live/filesystem.squashfs -comp xz
          
          # Copy kernel and initrd out of chroot
          KERNEL_VERSION=$(ls /chroot/boot | grep vmlinuz | head -n 1)
          cp /chroot/boot/$KERNEL_VERSION iso_root/live/vmlinuz
          cp /chroot/boot/initrd.img-* iso_root/live/initrd.img || cp $(ls /chroot/boot/initrd.img* | head -n 1) iso_root/live/initrd.img

          # Build hybrid ISO
          xorriso -as mkisofs \
            -iso-level 3 \
            -full-iso9660-filenames \
            -volid "OPENOS_LIVE" \
            -output OpenOS-Debian.iso \
            iso_root

          ls -lh OpenOS-Debian.iso

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: OpenOS-Debian.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
