name: Build OpenOS ISO

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Custom Debian ISO
        uses: pguyot/arm-bianchi-action@v1 # or use standard container build tools
        with:
          target: iso

      - name: Generate Stable Live ISO
        run: |
          sudo apt-get update
          sudo apt-get install -y genisoimage xorriso squashfs-tools
          
          # Create working directory structure
          mkdir -p iso_root/live
          
          # Build a clean minimal squashfs root
          sudo debootstrap --arch=amd64 bookworm rootfs http://deb.debian.org/debian/
          
          # Install packages inside rootfs
          sudo chroot rootfs bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update && apt-get install -y --no-install-recommends \
              linux-image-amd64 python3 curl git htop bat tldr fish starship xorg xinit xfce4 plank sudo
            apt-get clean
          '
          
          sudo mksquashfs rootfs iso_root/live/filesystem.squashfs -comp xz -b 1048576
          
          # Extract kernel and initrd
          cp rootfs/boot/vmlinuz-* iso_root/live/vmlinuz
          cp rootfs/boot/initrd.img-* iso_root/live/initrd.img
          
          # Create final ISO image
          xorriso -as mkisofs \
            -iso-level 3 \
            -full-iso9660-filenames \
            -volid "OPENOS_LIVE" \
            -output OpenOS-Debian.iso \
            iso_root

          ls -lh OpenOS-Debian.iso

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: OpenOS-Debian.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
